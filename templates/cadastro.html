<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Finanças Pessoais</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Tela de cadastro: standalone, mesmo padrao da tela de login. -->
    <main>
        <div class="container">
            <div class="card" style="max-width: 420px; margin: 3rem auto;">
                <h1>📝 Criar conta</h1>

                {% with mensagens = get_flashed_messages(with_categories=true) %}
                  {% for categoria, msg in mensagens %}
                    <p class="flash {{ categoria }}">{{ msg }}</p>
                  {% endfor %}
                {% endwith %}

                <form method="POST" action="{{ url_for('auth.cadastro') }}">
                    <div class="form-group">
                        <label>E-mail:</label>
                        <input type="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label>Senha:</label>
                        <input type="password" name="senha" required>
                    </div>
                    <div class="form-group">
                        <!-- tipo_perfil define o comportamento do sistema:
                             pessoa fisica x empresa (categorias, contas, etc). -->
                        <label>Tipo de perfil:</label>
                        <select name="tipo_perfil" required>
                            <option value="pessoa_fisica">Pessoa Física</option>
                            <option value="empresa">Empresa</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary">Cadastrar</button>
                </form>

                <p>Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
            </div>
        </div>
    </main>
</body>
</html>
