<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Finanças Pessoais{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- BARRA DE NAVEGAÇÃO (MENU PRINCIPAL) -->
    <nav>
        <div class="logo">
            <span>💰</span> Finanças Pessoais
        </div>
        <ul>
            <li><a href="{{ url_for('dashboard.dashboard') }}">📊 Dashboard</a></li>
            <li><a href="{{ url_for('transacoes.listar') }}">💸 Transações</a></li>
            <li><a href="{{ url_for('metas.listar') }}">🎯 Metas</a></li>
            <li><a href="{{ url_for('auth.logout') }}">🚪 Sair</a></li>
        </ul>
    </nav>

    <!-- CONTEÚDO PRINCIPAL -->
    <!-- Os templates que herdarem base.html vão preencher o bloco 'content' -->
    <main>
        {% block content %}
        <!-- Conteúdo específico de cada página vai aqui -->
        {% endblock %}
    </main>

    <!-- RODAPÉ -->
    <footer>
        <p>&copy; 2026 - Finanças Pessoais | Desenvolvido para Laboratório de Programação</p>
    </footer>
</body>
</html>
